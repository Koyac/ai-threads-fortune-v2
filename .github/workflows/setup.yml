# 初回だけ手動で1回実行する、種(seeds.jsonl)の生成ジョブ。
# 既に seeds.jsonl に中身がある場合、build_seeds.py 側が何もせず終了する。

name: Setup (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_seeds.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seeds.jsonl
          git commit -m "初回データ生成" || echo "変更なし"
          git push
